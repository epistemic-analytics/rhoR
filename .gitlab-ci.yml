.release_definition: &release_definition
  stage: release
  image: $REG_URL/release:current
  #dependencies:
  #  - check:r-release
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG
  except:
    - branches
    - master
  <<: *build_template
  script:
    - cat ./${PKG}/cran-comments.md || true
    - ls -al || true
    - Rscript -e "devtools:::upload_cran(devtools::as.package(\"${PKG}\"), \"./${PKG}_${VERSION}.tar.gz\")"
    - "curl --request POST --header \"PRIVATE-TOKEN: ${GITLAB_API_TOKEN}\" --data-urlencode \"tag_name=${VERSION}\" --data-urlencode \"name=v${VERSION}\" --data-urlencode \"description=Automatically created from CI for ${VERSION}\" \"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases?ref=${CI_COMMIT_REF_NAME}\""
  allow_failure: false
release:cran-manual:
  <<: *release_definition
  when: manual


coverage:
  stage: deploy
  image: $REG_URL/release-test:current
  artifacts:
    paths:
      - public/
    expire_in: 30 days
  script:
    - rm -rf src/RcppExports*
    - rm -rf R/RcppExports*
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}/\" DESCRIPTION"
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'install.packages("microbenchmark")'
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e "devtools::install(\".\", quick = T, build = T, dependencies = F, upgrade = F)"
    - |
        Rscript -e "cov <- covr::package_coverage(quiet = F);
                    print(cov);
                    rep <- covr::report( x = cov, file = \"public/coverage/index.html\", browse = FALSE );"
  only:
    refs:
      - master
    # variables:
    #   - $CI_COMMIT_MESSAGE =~ /.*\[build pages\].*/
  except:
    refs:
      - tags

release:cranqe:
  stage: release
  image: rocker/tidyverse:4.0.3
  artifacts:
    paths:
      - archive/
      - ${PKGL}/
    expire_in: 1 week
  only:
    refs:
      - master
  before_script:
    - apt update && apt install -y curl libxt-dev
  script:
    - R --version
    - export VERSION_TIMESTAMP=$(date +%y%m%d%H%M)
    - echo $VERSION_TIMESTAMP
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}.${VERSION_TIMESTAMP}/\" DESCRIPTION"
    - Rscript -e 'install.packages("pkgdown")'
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - mkdir -p archive/
    - cd ..; R CMD build --resave-data --no-manual --log $PKG
    - mv ./${PKG}_${VERSION}.${VERSION_TIMESTAMP}.tar.gz $PKG/archive/
    - cd $PKG/
    - Rscript -e 'pkgdown::build_site()'
    - ls -al || true
    - mkdir -p $PKGL/
    - mv public/* $PKGL/ || true
    - ls -al $PKGL/ || true
    - curl --request POST --form "token=$CI_JOB_TOKEN" --form "variables[QE_PROJECT_NAME]=${PKGL}" --form "variables[QE_PROJECT_ID]=${CI_PROJECT_ID}" --form ref=master https://gitlab.com/api/v4/projects/22522458/trigger/pipeline


# Docker Image steps
.docker_variables: &docker_variables
  DOCKER_HOST: tcp://localhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
.docker_definition: &docker_template
  stage: docker
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $REG_URL/$TAG:current -f inst/docker/rhor-$FILE inst/docker/
    - docker push $REG_URL/$TAG:current
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[build docker\].*/ || $DOCKER_FORCE_REBUILD
docker:release:
  variables:
    <<: *docker_variables
    TAG: "release"
    FILE: "release"
  <<: *docker_template
docker:release-test:
  variables:
    <<: *docker_variables
    TAG: "release-test"
    FILE: "release-test"
  <<: *docker_template
docker:old-release:
  variables:
    <<: *docker_variables
    TAG: "old-release"
    FILE: "oldrelease"
  <<: *docker_template
docker:devel:
  variables:
    <<: *docker_variables
    TAG: "devel"
    FILE: "devel"
  <<: *docker_template
  
  