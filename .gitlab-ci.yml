stages:
  - test

# ── R package tests ───────────────────────────────────────────────────────────
# cranqe builds the release with R CMD check --no-tests, so this job doesn't gate
# the release; it's the visible signal that testthat is green.
test:r:
  stage: test
  image: rocker/r-ver:4.5.0
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends
        build-essential gfortran
        libopenblas-dev liblapack-dev
    - Rscript -e "install.packages(
        c('Rcpp', 'RcppArmadillo', 'testthat'),
        repos = 'https://packagemanager.posit.co/cran/__linux__/noble/latest',
        quiet = TRUE)"
  script:
    - R CMD INSTALL .
    - Rscript -e "testthat::test_local('.', reporter = 'progress')"

# ── cranqe integration ────────────────────────────────────────────────────────
# Mirrors the modern qe-package integration (see rENA). cranqe does the actual
# build/release; this CI just requests it:
#   trigger-cranqe         (.post, main push): request a dev build after every push
#   verify-tag-version     (.pre, tags):       confirm git tag == DESCRIPTION Version
#   trigger-cranqe-release (.post, tags):      request a release build after a tag
#
# Release: bump Version in DESCRIPTION, push, then `git tag vX.Y.Z && git push
# origin vX.Y.Z` → verify-tag-version gates, trigger-cranqe-release publishes.
include:
  - project: 'epistemic-analytics/qe-packages/cranqe'
    ref: main
    file: '/ci-templates/trigger-cranqe.yml'
