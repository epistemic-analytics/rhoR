stages:
  - docker
  - check
  - deploy
  - release

variables:
  VERSION: "1.3.1"
  PKG: "rhoR"
  PKGL: "rhor"
  REG_URL: "${CI_REGISTRY}/epistemic-analytics/qe-packages/rhor"

# Templates
.check_condition: &check_condition
  except:
    refs:
      - tags
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[check docker\].*/
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_=TRUE
    - export _R_CHECK_CRAN_INCOMING_REMOTE_=TRUE
    - export _R_CHECK_FORCE_SUGGESTS_=TRUE
    - export _R_CLASS_MATRIX_ARRAY_=true
    - export _R_CHECK_LENGTH_1_CONDITION_="package:_R_CHECK_PACKAGE_NAME_,verbose"
    - mkdir -p archive/
    - rm -f ./R/RcppExports*
    - rm -f ./src/RcppExports*
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'install.packages(c("microbenchmark", "knitr", "rmarkdown"))'
    - Rscript -e 'roxygen2::roxygenise(".")'
    - cd ..; R CMD build --log ${PKG} || true
.check_definition: &check_template
  stage: check
  artifacts:
    paths:
      - build/
      - archive/
      - doc/
      - inst/doc/
    expire_in: 1 week
  <<: *build_template
  script:
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check ${PKG}_$VERSION.tar.gz --as-cran --no-manual || true
    - cat /builds/epistemic-analytics/qe-packages/rhoR.Rcheck/00install.out || true
    - cat /builds/epistemic-analytics/qe-packages/rhoR.Rcheck/00check.log || true
    - mv ./${PKG}-00build.log ${PKG}/archive/ || true
    - mv ./${PKG}.Rcheck/00check.log ${PKG}/archive/ || true
    - mv ./${PKG}.Rcheck/00install.out ${PKG}/archive/ || true
    - mv ./${PKG}_*.tar.gz ${PKG}/archive/ || true
  tags:
    - docker
  allow_failure: false
  <<: *check_condition

# Check Steps
check:r-devel:
  image: $REG_URL/devel:current
  only:
    - master
  <<: *check_template
#check:r-oldrelease:
#  image: $REG_URL/old-release:current
#  only:
#    - master
#  <<: *check_template
check:r-release:
  image: $REG_URL/release:current
  <<: *check_template



# Rhub Checks
.rhub_condition: &rhub_condition
  except:
    refs:
      - tags
  #only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[skip rhub\].*/
.rhub_definition: &rhub_definition
  stage: check
  image: $CI_REGISTRY_IMAGE/release:current
  before_script:
    - Rscript -e 'install.packages("rhub")'
  script:
    - |
        Rscript -e "rhub::validate_email(email = \"${RHUB_EMAIL_ADDRESS}\", token = \"${RHUB_EMAIL_TOKEN}\");
                    checked <- rhub::check(
                      platform = \"${RHUB_PLATFORM}\", show_status = TRUE,
                      env_vars = c(
                        \"_R_CHECK_CRAN_INCOMING_\" = \"true\",
                        \"_R_CHECK_CRAN_INCOMING_REMOTE_\" = \"true\",
                        \"_R_CHECK_FORCE_SUGGESTS_\" = \"true\",
                        \"_R_CLASS_MATRIX_ARRAY_\"=\"true\",
                        \"R_REMOTES_STANDALONE\"=\"true\",
                        \"R_REMOTES_NO_ERRORS_FROM_WARNINGS\"=\"true\"
                      )
                    );
                    checked\$cran_summary();
                    rhub_content <- function(text_url) {
                      text_get <- httr::GET(url = text_url)
                      test_content <- strsplit(httr::content(text_get), split = \"\\\\n\")[[1]];
                      err_found <- grep(x = test_content, pattern = \"runtime error\");
                      print(test_content[err_found]);
                      return(err_found);
                    }
                    if(!checked\$.__enclos_env__\$private\$status_[[1]]\$status %in% c('error', 'warning')) {
                      rhub_errors <- rhub_content(checked\$urls()\$text);
                      if(length(rhub_errors) > 0) { quit(status = 1); }
                      else { quit(status = 0); }
                    } else { quit(status = 1); }"
  only:
    variables:
      - $RHUB_EMAIL_ADDRESS
      - $RHUB_EMAIL_TOKEN
  <<: *rhub_condition
check:r-hub-windows-old-release:
  variables:
    RHUB_PLATFORM: "windows-x86_64-oldrel"
  <<: *rhub_definition
check:r-hub-windows-release:
