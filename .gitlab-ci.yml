stages:
  - docker
  - check
  - deploy
  - release

variables:
  VERSION: "1.3.0.2"
  PKG: "rhoR"
  PKGL: "rhor"
  REG_URL: "${CI_REGISTRY}/epistemic-analytics/qe-packages/rhor"

# Templates
.check_condition: &check_condition
  except:
    refs:
      - tags
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[check docker\].*/
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_=TRUE
    - export _R_CHECK_CRAN_INCOMING_REMOTE_=TRUE
    - export _R_CHECK_FORCE_SUGGESTS_=TRUE
    - export _R_CLASS_MATRIX_ARRAY_=true
    - export _R_CHECK_LENGTH_1_CONDITION_="package:_R_CHECK_PACKAGE_NAME_,verbose"
    - mkdir -p archive/
    - rm -f ./R/RcppExports*
    - rm -f ./src/RcppExports*
    - mkdir -p ~/.R/
    - rm -f ~/.R/Makevars
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e 'install.packages(c("microbenchmark", "knitr", "rmarkdown"))'
    - Rscript -e 'roxygen2::roxygenise(".")'
    - cd ..; R CMD build --log ${PKG} || true
.check_definition: &check_template
  stage: check
  artifacts:
    paths:
      - build/
      - archive/
      - doc/
      - inst/doc/
    expire_in: 1 week
  <<: *build_template
  script:
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check ${PKG}_$VERSION.tar.gz --as-cran --no-manual || true
    - cat /builds/epistemic-analytics/qe-packages/rhoR.Rcheck/00install.out || true
    - cat /builds/epistemic-analytics/qe-packages/rhoR.Rcheck/00check.log || true
    - mv ./${PKG}-00build.log ${PKG}/archive/ || true
    - mv ./${PKG}.Rcheck/00check.log ${PKG}/archive/ || true
    - mv ./${PKG}.Rcheck/00install.out ${PKG}/archive/ || true
    - mv ./${PKG}_*.tar.gz ${PKG}/archive/ || true
  tags:
    - docker
  allow_failure: false
  <<: *check_condition

# Check Steps
check:r-devel:
  image: $REG_URL/devel:current
  only:
    - master
  <<: *check_template
#check:r-oldrelease:
#  image: $REG_URL/old-release:current
#  only:
#    - master
#  <<: *check_template
check:r-release:
  image: $REG_URL/release:current
  <<: *check_template


pages:
  stage: deploy
  image: $REG_URL/release-test:current
  script:
    - rm -rf src/RcppExports*
    - rm -rf R/RcppExports*
    - "sed -i -e \"s/Version: \\(.*\\)/Version: ${VERSION}/\" DESCRIPTION"
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - Rscript -e 'install.packages("microbenchmark")'
    - Rscript -e 'Rcpp::compileAttributes()'
    - Rscript -e "devtools::install(\".\", quick = T, build = T, dependencies = F, upgrade = F)"
    - Rscript -e "pkgdown::build_site(preview = F, devel = T, lazy = T, new_process = T)"
    - |
        Rscript -e "cov <- covr::package_coverage(quiet = F);
                    rep <- covr::report( x = cov, file = \"public/coverage/index.html\", browse = FALSE );"
  artifacts:
    paths:
      - public
    expire_in: 30 days
  only:
    - master
  except:
    refs:
      - tags
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[skip pages\].*/

release:cran:
  stage: release
  image: egruw/r-ftp
  dependencies:
    - check:r-release
  only:
    - tags
  except:
    - branches
  when: manual
  <<: *build_template 
  script:
    - cat rhoR/cran-comments.md
    - Rscript -e "devtools:::upload_cran(devtools::as.package('rhoR/'), \"rhoR_$VERSION.tar.gz\")"
  tags:
    - docker
  allow_failure: false



# Docker Image steps
.docker_variables: &docker_variables
  DOCKER_HOST: tcp://localhost:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
.docker_definition: &docker_template
  stage: docker
  image: docker:19.03.1
  services:
    - docker:19.03.1-dind
  before_script:
    - docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY
  script:
    - docker build -t $REG_URL/$TAG:current -f inst/docker/rhor-$FILE inst/docker/
    - docker push $REG_URL/$TAG:current
  only:
    variables:
      - $CI_COMMIT_MESSAGE =~ /.*\[build docker\].*/ || $DOCKER_FORCE_REBUILD
docker:release:
  variables:
    <<: *docker_variables
    TAG: "release"
    FILE: "release"
  <<: *docker_template
docker:release-test:
  variables:
    <<: *docker_variables
    TAG: "release-test"
    FILE: "release-test"
  <<: *docker_template
docker:old-release:
  variables:
    <<: *docker_variables
    TAG: "old-release"
    FILE: "oldrelease"
  <<: *docker_template
docker:devel:
  variables:
    <<: *docker_variables
    TAG: "devel"
    FILE: "devel"
  <<: *docker_template
  
  