stages:
  - check
  - checkWindows
  - release
  - buildAPI

variables:
  VERSION: "1.2.1.0"

# Templates
.build_definition: &build_template
  before_script:
    - export _R_CHECK_CRAN_INCOMING_=FALSE
    - export _R_CHECK_FORCE_SUGGESTS_=TRUE
    - mkdir -p build/
    - Rscript -e 'update(devtools::dev_package_deps("."))'
    - cd ..; R CMD build --resave-data --no-manual --log rhoR || true
    
.check_definition: &check_template
  stage: check
  artifacts:
    paths:
      - build/
    expire_in: 1 week
  <<: *build_template
  script:
    - R --no-site-file --no-environ --no-save --no-restore --quiet CMD check rhoR_$VERSION.tar.gz --as-cran --no-manual
    - ls -al ./
    - ls -al ./rhoR.Rcheck/
    - mv ./rhoR-00build.log rhoR/build/ || true
    - mv ./rhoR.Rcheck/00check.log rhoR/build/ || true
    - mv ./rhoR.Rcheck/00install.out rhoR/build/ || true
    - mv ./rhoR_$VERSION.tar.gz rhoR/build/
  tags:
    - docker
  allow_failure: false

# Check Steps
check:r-devel:
  image: egruw/rhor-r-devel:latest
  only:
    - master
  <<: *check_template
  
check:r-oldrelease:
  image: egruw/rhor-r-oldrelease:latest
  only:
    - master
  <<: *check_template
  
check:r-release:
  image: egruw/rhor-r-release:latest
  <<: *check_template
  
check:r-winbuilder:
  stage: checkWindows
  image: egruw/r-ftp
  only:
    - master
  <<: *build_template
  script:
    - curl -v -T rhoR_$VERSION.tar.gz ftp://win-builder.r-project.org/R-oldrelease/rhoR_$VERSION.tar.gz
    - curl -v -T rhoR_$VERSION.tar.gz ftp://win-builder.r-project.org/R-release/rhoR_$VERSION.tar.gz
    - curl -v -T rhoR_$VERSION.tar.gz ftp://win-builder.r-project.org/R-devel/rhoR_$VERSION.tar.gz
    - mv ./rhoR_$VERSION.tar.gz rhoR/build/
  tags:
    - docker
  allow_failure: false

release:cran:
  stage: release
  image: egruw/r-ftp
  dependencies:
    - check:r-release
  only:
    - tags
  except:
    - branches
  when: manual
  script:
    - cat cran-comments.md
    - Rscript -e "devtools:::upload_cran(devtools::as.package('.'), './build/rhoR_$VERSION.tar.gz')"
  tags:
    - docker
  allow_failure: false